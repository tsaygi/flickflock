[package]
name = "ff-core"
description = "Platform-independent, GUI-free core of the FlickFlock image viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# AVIF decoding through dav1d (needs libdav1d available at build time).
avif = ["image/avif-native"]

[lints]
workspace = true

[dependencies]
image.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
jxl-oxide = { version = "0.12", features = ["image"] }
psd = "0.3"
kamadak-exif = "0.6"
qcms = "0.3"
img-parts = "0.4"
notify = "9"
directories = "6"
qoi = "0.4"

[dev-dependencies]
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "perf"
harness = false
