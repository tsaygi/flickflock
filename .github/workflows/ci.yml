name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p flickflock

  package:
    name: Package (${{ matrix.os }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - name: Package (macOS, Universal)
        if: runner.os == 'macOS'
        run: packaging/macos/bundle.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-packager --locked
          cargo packager --release -p flickflock --formats wix,nsis
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-packager --locked
          cargo packager --release -p flickflock --formats deb,appimage
      - name: Package (.rpm)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p crates/ff-app -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: flickflock-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
